name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install PyG binary extensions (torch_scatter, torch_sparse)
        run: uv pip install torch-scatter torch-sparse -f https://data.pyg.org/whl/torch-2.8.0+cpu.html

      - name: Install Chrome for Plotly image export
        run: uv run plotly_get_chrome -y

      - name: Lint
        run: uv run ruff check src/ tests/ scripts/

      - name: Format check
        run: uv run ruff format --check src/ tests/ scripts/

      - name: Type check
        run: uv run mypy src/ tests/

      - name: Unit and integration tests
        run: uv run pytest tests/ --ignore=tests/test_e2e_dummy_workflow.py -v

  e2e:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install PyG binary extensions (torch_scatter, torch_sparse)
        run: uv pip install torch-scatter torch-sparse -f https://data.pyg.org/whl/torch-2.8.0+cpu.html

      - name: Install Chrome for Plotly image export
        run: uv run plotly_get_chrome -y

      - name: Dummy E2E workflow
        run: uv run pytest tests/test_e2e_dummy_workflow.py -v
