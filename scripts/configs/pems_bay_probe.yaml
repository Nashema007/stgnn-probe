datasets:
  - name: PEMS-BAY
    num_nodes: 325
    raw_data: data/probe_inputs/pems_bay/pems_bay_raw.npy
    coordinates: data/probe_inputs/pems_bay/pems_bay_coords.csv
    ground_truth: data/probe_inputs/pems_bay/ground_truth.npy
    predictions_dir: data/probe_inputs/pems_bay/predictions
    adjacency_dir: data/probe_inputs/pems_bay/adjacency
    horizons: [6, 12, 42]
    horizon_minutes: [30, 60, 210]

models:
  temporal_baselines: [arima, tcn]
  spatial_models: [gwn, gwn_v2, stawnet, staeformer, dssa_tcn, d2stgnn, bigst]

granger:
  # Fixed lag p = 12 for every ordered pair (no lag selection), matching the
  # 12-step model input window. The reference is fitted once on the full series.
  max_lag: 12
  significance: 0.05
  # GCG keeps each node's top-k strongest incoming edges by F-statistic
  # (density = k/(N-1) ~= 3% at k=10, N=325). Effect-size sparsification —
  # p-value significance is non-discriminative here (median p ~ 1e-48, ~86%
  # dense). Re-derived from cached F-stats, so changing this does NOT rerun
  # the Granger tests.
  gcg_top_k: 10
  # -1 (all cores) oversubscribed RAM on the training box: each forked
  # worker holds 2-3GB resident (torch/numpy/statsmodels), so all-cores
  # pushed combined RES past available RAM and swap filled, grinding to
  # a crawl. With BLAS threads also now capped to 1/worker (see
  # lens2_granger.py's _init_worker), each worker is cheaper (~1.3-2.3GB
  # RES, 1 core), so this can go higher than the original cap of 16 —
  # 32 still leaves headroom on the 120-core/128GB box for other users'
  # workloads. Re-check `free -h`/`top` before launching and raise/lower
  # to match whatever else is running on the box at the time.
  n_jobs: 32

community:
  algorithm: louvain
  num_runs: 10
  resolution: 1.0
  random_seed: 0

alignment:
  threshold: 0.1
  sweep_min: 0.0
  sweep_max: 1.0
  sweep_steps: 21

sgs_threshold: 0.1        # absolute-SGS reference (target units); reporting only
sgs_rel_threshold: 0.01   # relative-SGS threshold for node labels (1% of TCN MAE, scale-free)

performance:
  primary_metric: mae
  horizon_groups:
    short_range: [30]
    boundary: [60]
    long_range: [210]
  baselines:
    statistical: arima
    temporal: tcn
  model_groups:
    statistical_baseline: [arima]
    temporal_baseline: [tcn]
    graph_wavenet_based: [gwn, gwn_v2]
    attention_adaptive_stgnn: [stawnet, dssa_tcn, staeformer]
    decoupled_stgnn: [d2stgnn]
    linear_complexity_stgnn: [bigst]
  ranking_lower_is_better: true
