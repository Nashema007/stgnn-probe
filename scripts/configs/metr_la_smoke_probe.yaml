# Companion probe config for scripts/configs/metr_la_smoke_new_models.yaml —
# single horizon (6 steps / 30 min) smoke verification only.

datasets:
  - name: METR-LA
    num_nodes: 207
    raw_data: data/probe_inputs/metr_la/metr_la_raw.npy
    coordinates: data/probe_inputs/metr_la/metr_la_coords.csv
    ground_truth: data/probe_inputs/metr_la_smoke/ground_truth.npy
    predictions_dir: data/probe_inputs/metr_la_smoke/predictions
    adjacency_dir: data/probe_inputs/metr_la_smoke/adjacency
    horizons: [6]
    horizon_minutes: [30]

# Must cover every model metr_la_smoke_new_models.yaml trains, or the smoke run
# pays to generate predictions that Lens 0 then silently skips. Model discovery
# reads performance.model_groups below, so that list is the one that matters.
models:
  temporal_baselines: [arima, tcn]
  spatial_models: [d2stgnn, bigst]

granger:
  max_lag: 6
  significance: 0.05
  # -1 (all cores) oversubscribed RAM on the training box (120 cores x
  # 2-3GB/worker >> available RAM, filled swap). Capped for the same
  # reason as metr_la_probe.yaml / pems_bay_probe.yaml.
  n_jobs: 16

community:
  algorithm: louvain
  num_runs: 10
  resolution: 1.0
  random_seed: 0

alignment:
  threshold: 0.1
  sweep_min: 0.0
  sweep_max: 1.0
  sweep_steps: 21

sgs_threshold: 0.1

performance:
  primary_metric: mae
  horizon_groups:
    short_range: [30]
  baselines:
    statistical: arima
    temporal: tcn
  model_groups:
    statistical_baseline: [arima]
    temporal_baseline: [tcn]
    decoupled_stgnn: [d2stgnn]
    linear_complexity_stgnn: [bigst]
  ranking_lower_is_better: true
