# ============================================================================
# LONG-INPUT SENSITIVITY ARM — METR-LA, in_len = 42 (210 min of history)
# ============================================================================
# Long-input sensitivity analysis: the main benchmark predicts up to
# h=42 (210 min) from only in_len=12 (60 min). This arm re-runs the SAME models
# and horizons with in_len=42 to test whether the near-disappearance of the
# STGNN advantage at long horizons persists when every model receives
# substantially more temporal context.
#
# This does NOT replace the main experiment. The controlled benchmark stays at
# metr_la_training.yaml (in_len=12). All artifacts here write to *_in42/ paths
# so the two arms never overwrite each other.
#
# ---------------------------------------------------------------------------
# RECEPTIVE-FIELD (dilation) CHANGE — reported alongside this arm's results
# ---------------------------------------------------------------------------
# The dilated-convolution models (TCN, GWN, GWN v2, STAWnet, DSSA-TCN) have a
# FIXED temporal receptive field set by their depth/dilation — ~13 steps at the
# published config. Feeding them a 42-step window without deepening them would
# leave their last-step prediction dependent on only the final ~13 inputs (the
# earlier ~29 are dead input; see tsl graph_wavenet_model.py:158 — it pads a
# short input but never uses context beyond its receptive field). That would
# make this a test of the baseline's extra context, not the STGNNs', and bias
# the comparison against graphs.
#
# So for THIS arm only, every dilated-conv model's receptive field is grown to
# span the full 42-step window (RF = 43, dilation cycle [1,2,4], max dilation 4)
# via the model_overrides below. Receptive field formulae:
#   * TCN (tsl):          RF = 1 + (k-1)*n_layers*(dilation^n_convs - 1)/(dilation-1)
#                         n_layers=6, n_convs_layer=3, dilation=2, k=2  -> 1+6*7 = 43
#   * GWN (tsl):          RF = 1 + (k-1)*sum_i dilation^(i mod dilation_mod)
#                         n_layers=18, dilation_mod=3, dilation=2, k=2  -> 1+6*(1+2+4) = 43
#   * GWN v2/STAWnet/DSSA-TCN (custom): RF = 1 + blocks*(2^layers - 1)
#                         blocks=6, layers=3, k=2                       -> 1+6*7 = 43
# The attention / explicit-window models (STAEformer, BigST, D2STGNN)
# already consume the entire in_len window natively and need no override.
# ============================================================================

dataset_name: METR-LA
num_nodes: 207
# Sensitivity arm targets the single critical cell: 42-step input
# (210 min) -> 42-step horizon (210 min). The main arm (in_len=12) carries the
# full horizon curve; here we only need h=42 to test whether the STGNN
# advantage at 210 min persists once every model receives 210 min of context.
horizons: [42]
num_runs: 3

# Isolated artifact paths (do NOT share with the in_len=12 main arm)
output_dir: outputs/metr_la_in42/
ground_truth_path: data/probe_inputs/metr_la_in42/ground_truth.npy
predictions_dir: data/probe_inputs/metr_la_in42/predictions/
adjacency_dir: data/probe_inputs/metr_la_in42/adjacency/
checkpoint_dir: checkpoints/metr_la_in42/
probe_config_path: scripts/configs/metr_la_probe.yaml

in_len: 42
in_dim: 3
batch_size: 64
val_len: 0.125
test_len: 0.2
device: auto
epochs: 100
patience: 15
null_val: 0.0
use_wandb: true

spatial_models:
  - gwn
  - gwn_v2
  - stawnet
  - staeformer
  - d2stgnn
  - bigst
  - dssa_tcn

# Receptive-field bumps so every dilated-conv model spans the 42-step window.
# Applied on top of scripts/configs/models/<model>_base.yaml (highest precedence).
model_overrides:
  tcn:
    n_layers: 6
    n_convs_layer: 3
    dilation: 2
  gwn:
    n_layers: 18
    dilation_mod: 3
    dilation: 2
  gwn_v2:
    blocks: 6
    layers: 3
  stawnet:
    blocks: 6
    layers: 3
  dssa_tcn:
    blocks: 6
    layers: 3
