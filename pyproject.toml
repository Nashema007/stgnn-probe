[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "stgnn-framework"
version = "0.1.0"
description = "A clean PyTorch framework for running and analysing STGNN models."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=1.26,<2",
    # <3: torch-spatiotemporal==0.9.5 hardcodes the "5T" pandas offset alias
    # (tsl/datasets/metr_la.py, pems_bay.py), which pandas 3.0 removed.
    "pandas>=2.2,<3",
    "pyyaml>=6.0",
    "scipy>=1.15",
    "statsmodels>=0.14",
    "threadpoolctl>=3.0",
    # 2.7 was the first stable PyTorch release with official NVIDIA Blackwell
    # (sm_120, e.g. RTX PRO 6000) kernel support (CUDA 12.8 wheels); 2.8
    # matures that support further. Earlier pins (2.2.2) predate Blackwell
    # entirely and fail with "no kernel image is available for execution on
    # the device" on that hardware regardless of which CUDA toolkit is
    # installed alongside them.
    "torch==2.8.0",
    "torch-geometric>=2.8,<2.9",
    # torch-spatiotemporal's GraphWaveNetModel/TCNModel (used by data.tsl_pipeline)
    # transitively require torch_scatter/torch_sparse. Those are binary extensions
    # served from PyG's own wheel index, not PyPI, so `uv sync` alone cannot resolve
    # them — install them separately per the README's Environment Setup section
    # (same command CI and the Docker dev image use).
    "torch-spatiotemporal>=0.9.5,<0.10",
    "pytorch-lightning>=2.4,<2.7",
    "hydra-core>=1.3,<1.4",
    "tqdm>=4.67",
    "wandb>=0.16",
    "psutil>=5.9",
    "mypy==2.1.0",  # pinned exactly so CI (uv.lock) and the Docker dev image never drift apart
    "pytest>=8.3",
    "ruff>=0.11",
    "types-PyYAML>=6.0",
    "networkx>=3.3",
    "python-louvain>=0.16",
    "plotly>=5.20",
    "altair>=5.3",
    "kaleido>=0.2.1",
    "vl-convert-python>=1.0",
    "pygwalker>=0.4",
    "tables>=3.9",
    # pytorch-lightning 2.2.5 (a tsl dependency) imports pkg_resources
    # unconditionally at startup; setuptools>=81 dropped it by default.
    "setuptools<81",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src",
    "src/analysis",
    "src/config",
    "src/data",
    "src/evaluation",
    "src/models",
    "src/training",
]

[tool.uv]
# darwin x86_64 (Intel Mac) dropped: PyTorch stopped shipping wheels for that
# platform after 2.2.2, and torch>=2.7 is required for NVIDIA Blackwell
# (sm_120) GPU support.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "old-imp",
    "old-impl",
]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
exclude = [
    "^\\.venv/",
]
warn_unused_configs = true
ignore_missing_imports = true
strict = false

[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "scipy.*", "statsmodels.*", "wandb", "wandb.*"]
ignore_missing_imports = true
